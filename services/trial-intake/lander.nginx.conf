# nginx config for the webjmail-lander container. Serves the static landing
# page and proxies /api/ to the trial-intake service (same origin, so the form
# POST needs no CORS). Both containers share the `webjmail-net` docker network,
# so `webjmail-trial` resolves by container name.
server {
  listen 80;
  root /usr/share/nginx/html;

  location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }

  location /api/ {
    # Static upstream — nginx resolves the container name at startup via the
    # shared podman network. If the backend is recreated (new IP), recreate this
    # lander container too so it re-resolves. (Podman's DNS isn't at Docker's
    # 127.0.0.11, so a request-time resolver directive doesn't apply here.)
    proxy_pass http://webjmail-trial:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
