# Generic static serving for the webjmail web client.
# Connects to whatever JMAP server the user enters (their server must allow the
# app's origin via CORS — see https://webjmail.com/#connect).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
